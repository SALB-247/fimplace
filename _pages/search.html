---
layout: page
title: 검색
id: search
permalink: /search/
description: 르세라핌이 다녀간 카페·음식점·촬영지를 이름, 주소, 태그, 멤버로 한 번에 검색하세요.
---

<h1 data-i18n="search_title">장소 검색</h1>

<p style="color: var(--subtext); font-size: 0.95em;">
  <span data-i18n="search_intro">장소명, 주소, 태그, 멤버를 공백으로 구분해 여러 단어 검색이 가능합니다. (모든 단어 포함)</span>
</p>

<input type="search" id="search-input" placeholder="예: 사쿠라 카페 용산" data-i18n-ph="search_input_placeholder"
       autofocus autocomplete="off"
       style="width: 100%; padding: 0.8em 1em; font-size: 16px;
              border: 1px solid var(--border); border-radius: 8px;
              background: var(--input-bg); color: var(--text);
              font-family: inherit; margin-bottom: 1.5em;
              box-sizing: border-box; min-height: 48px;" />

<div id="search-meta" style="font-size: 0.85em; color: var(--subtext); margin-bottom: 1em;"></div>

<ul id="search-results" class="result-list"></ul>

<script>
(function () {
  var input = document.getElementById('search-input');
  var meta  = document.getElementById('search-meta');
  var ul    = document.getElementById('search-results');
  var INDEX = null;

  function loadIndex(cb) {
    if (INDEX) return cb(INDEX);
    fetch('{{ site.baseurl }}/search-index.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        INDEX = (data || []).map(function (item) {
          return {
            raw:       item,
            titleN:    normalize(item.title) + ' ' + normalize(item.name_en || ''),
            tagsN:     normalize((item.tags || []).join(' ')) +
                       (window.FimLang === 'en'
                         ? normalize((item.tags || []).map(FimTag).join(' ')) : ''),
            membersN:  normalize((item.members || []).join(' ')),
            addressN:  normalize(item.address || '') + ' ' + normalize(item.address_en || ''),
            bodyN:     normalize(item.excerpt || '')
          };
        });
        cb(INDEX);
      })
      .catch(function (e) {
        meta.textContent = window.FimLang === 'en'
          ? FimFmt(FimT('search_index_fail', ''), [e])
          : '검색 인덱스를 불러올 수 없습니다. (' + e + ')';
      });
  }

  // 한글 친화 정규화: NFC + 소문자 + 공백 제거
  function normalize(s) {
    s = (s || '').toString();
    if (s.normalize) s = s.normalize('NFC');
    return s.toLowerCase().replace(/\s+/g, '');
  }

  // 단어 하나가 한 노트에서 얻는 점수. 어느 필드에도 없으면 0.
  function partScore(part, idx) {
    if (idx.titleN.indexOf(part)    !== -1) return 100;
    if (idx.tagsN.indexOf(part)     !== -1) return  60;
    if (idx.membersN.indexOf(part)  !== -1) return  50;
    if (idx.addressN.indexOf(part)  !== -1) return  40;
    if (idx.bodyN.indexOf(part)     !== -1) return  20;
    return 0;
  }

  // 다중 단어 AND 매칭: 모든 단어가 어딘가에 매칭되어야 함
  function score(parts, idx) {
    var total = 0;
    for (var i = 0; i < parts.length; i++) {
      var s = partScore(parts[i], idx);
      if (s === 0) return 0;  // 한 단어라도 없으면 fail
      total += s;
    }
    return total;
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(q) {
    var qNFC = (q || '').normalize ? q.normalize('NFC') : (q || '');
    var rawParts = qNFC.toLowerCase().split(/\s+/).filter(Boolean);
    var parts = rawParts.map(function (p) { return p.replace(/\s+/g, ''); }).filter(Boolean);

    if (parts.length === 0) {
      meta.textContent = '';
      ul.innerHTML = '';
      return;
    }
    loadIndex(function (idx) {
      var hits = [];
      for (var i = 0; i < idx.length; i++) {
        var s = score(parts, idx[i]);
        if (s > 0) hits.push({ s: s, item: idx[i].raw });
      }
      hits.sort(function (a, b) { return b.s - a.s; });
      hits = hits.slice(0, 100);

      meta.textContent = window.FimLang === 'en'
        ? FimFmt(FimT(hits.length === 1 ? 'search_count_one' : 'search_count', ''), [hits.length, idx.length])
        : hits.length + '개 결과 (전체 ' + idx.length + '개 노트 중)';

      ul.innerHTML = hits.map(function (h) {
        var i = h.item;
        var tagHtml = (i.tags || []).slice(0, 6).map(function (t) {
          return '<span class="tag-chip" style="margin-right:0.3em">#' + escapeHtml(FimTag(t)) + '</span>';
        }).join('');
        var addrTxt = (window.FimLang === 'en' && i.address_en) ? i.address_en : i.address;
        var addr = addrTxt ? '<div class="excerpt">📍 ' + escapeHtml(addrTxt) + '</div>' : '';
        var titleTxt = i.title;
        if (window.FimLang === 'en' && i.name_en) {
          if (normalize(i.name_en) !== normalize(i.title)) titleTxt = i.name_en + ' (' + i.title + ')';
        }
        var dateBadge = i.date ? '<span style="font-size:0.78em; color:var(--subtext); margin-right:0.4em;">📅 ' + escapeHtml(i.date) + '</span>' : '';
        return '<li>' +
          '<a class="internal-link" href="' + i.url + '">' + escapeHtml(titleTxt) + '</a> ' +
          dateBadge + tagHtml +
          addr +
          '</li>';
      }).join('');
    });
  }

  // ── 뒤로가기 복원 ──────────────────────────────────
  // 검색어를 URL(?q=)에 남긴다. 결과를 눌러 노트로 갔다가 뒤로 오면 같은 URL 이라
  // 검색어와 결과가 그대로 살아난다. 타이핑마다 pushState 하면 히스토리가 더러워지므로
  // replaceState 를 쓴다 (뒤로가기 한 번에 검색 페이지를 벗어난다).
  function syncURL(q) {
    try {
      var u = new URL(location.href);
      if (q) { u.searchParams.set('q', q); } else { u.searchParams.delete('q'); }
      history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    } catch (e) {}
  }
  function saveScroll() {
    try { sessionStorage.setItem('fimSearchY', String(window.scrollY)); } catch (e) {}
  }

  var timer = null;
  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      render(input.value);
      syncURL(input.value.trim());
    }, 120);
  });
  // 결과를 눌러 떠나기 직전 스크롤 위치를 기억
  ul.addEventListener('click', function (e) { if (e.target.closest('a')) saveScroll(); });

  var params = new URLSearchParams(window.location.search);
  if (params.get('q')) {
    input.value = params.get('q');
    render(input.value);
    // 결과가 그려진 뒤에 스크롤을 되돌린다 (렌더 전이면 높이가 없어 안 먹는다)
    try {
      var y = parseInt(sessionStorage.getItem('fimSearchY') || '0', 10);
      if (y > 0) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { window.scrollTo(0, y); });
        });
      }
      sessionStorage.removeItem('fimSearchY');
    } catch (e) {}
  }
})();
</script>
