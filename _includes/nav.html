<div class="nav-row">
  <div class="nav-links">
    <a class="internal-link" href="{{ site.baseurl }}/" style="font-weight: bold; color: var(--primary);">{{ site.title }}</a>
    <a class="internal-link" href="{{ site.baseurl }}/map/" data-i18n="nav_map">지도</a>
    <details class="nav-menu" id="nav-hubs">
      <summary data-i18n="nav_hubs">모음 ▾</summary>
      <div class="nav-menu-list">
        {%- for item in site.data.hub_menu -%}
          {%- if item.group -%}
            <div class="nav-menu-group" data-i18n="nav_group_{{ item.group }}">{{ item.group }}</div>
          {%- else -%}
            {%- assign hub = site.notes | where: "title", item.title | first -%}
            {%- if hub -%}
            <a class="internal-link" href="{{ site.baseurl }}{{ hub.url }}"
               {%- if hub.en_url %} data-en-href="{{ site.baseurl }}{{ hub.en_url }}"{% endif -%}
               {%- if hub.title_en %} data-en="{{ hub.title_en | escape }}"{% endif %}>{{ item.label }}</a>
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      </div>
    </details>
    <a class="internal-link" href="{{ site.baseurl }}/tags/" data-i18n="nav_tags">태그</a>
    <a class="internal-link" href="{{ site.baseurl }}/search/" data-i18n="nav_search">검색</a>
    <a class="internal-link" href="{{ site.baseurl }}/about" data-i18n="nav_about">소개</a>
    <button id="theme-toggle" type="button" aria-label="다크 모드 전환" title="테마 전환" data-i18n-aria="theme_toggle" data-i18n-title="theme_toggle"
            style="border:0; background:transparent; cursor:pointer; font-size:1.1em; line-height:1; padding:0.1em 0.3em;">🌙</button>
    <button id="lang-toggle" type="button" title="Language"
            style="border:1px solid var(--border); background:transparent; color:var(--subtext); cursor:pointer;
                   font-size:0.72em; font-family:inherit; line-height:1; padding:0.35em 0.5em; border-radius:999px;">EN</button>
  </div>

  <form class="search-box" action="{{ site.baseurl }}/search/" method="get" role="search">
    <input type="search" name="q" placeholder="장소 검색..." aria-label="검색"
           data-i18n-ph="nav_search_placeholder" data-i18n-aria="nav_search" />
  </form>
</div>

<script>
(function () {
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  function current() {
    return document.documentElement.getAttribute('data-theme')
      || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function setIcon() { btn.textContent = current() === 'dark' ? '☀️' : '🌙'; }
  setIcon();
  btn.addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    setIcon();
    // giscus 댓글 테마 동기화
    var f = document.querySelector('iframe.giscus-frame');
    if (f && f.contentWindow) {
      f.contentWindow.postMessage({ giscus: { setConfig: { theme: next } } }, 'https://giscus.app');
    }
  });
})();

// 언어 토글 — i18n.html 이 localStorage('fimLang') 를 읽으므로 값만 바꾸고 새로고침한다.
(function () {
  var b = document.getElementById('lang-toggle');
  if (!b) return;
  var cur = window.FimLang || 'ko';
  // 지구본을 붙여 '언어 전환' 이라는 게 아이콘만으로도 읽히게 한다
  b.textContent = cur === 'en' ? '🌐 한국어' : '🌐 EN';
  b.title = cur === 'en' ? '한국어로 보기' : 'View in English';
  // 모음 메뉴: 영어면 영어판 주소·제목으로, 바깥 클릭·ESC 로 닫힘
  var hubs = document.getElementById('nav-hubs');
  if (hubs) {
    if (cur === 'en') {
      hubs.querySelectorAll('a[data-en-href]').forEach(function (a) { a.setAttribute('href', a.getAttribute('data-en-href')); });
      hubs.querySelectorAll('a[data-en]').forEach(function (a) { a.textContent = a.getAttribute('data-en'); });
    }
    document.addEventListener('click', function (e) { if (hubs.open && !hubs.contains(e.target)) hubs.open = false; });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hubs.open = false; });
  }
  b.addEventListener('click', function () {
    var next = (window.FimLang === 'en') ? 'ko' : 'en';
    try { localStorage.setItem('fimLang', next); } catch (e) {}
    var u = new URL(location.href);
    u.searchParams.set('lang', next);
    location.href = u.toString();
  });
})();
</script>
