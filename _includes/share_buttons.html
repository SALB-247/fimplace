{%- assign share_url = site.url | append: site.baseurl | append: page.url -%}
{%- if page.shortid -%}
  {%- assign short_url = site.url | append: site.baseurl | append: "/s/" | append: page.shortid -%}
{%- else -%}
  {%- assign short_url = share_url -%}
{%- endif -%}
<div class="share-buttons" style="display:flex; gap:0.5em; flex-wrap:wrap; margin: 1.5em 0 0.5em; font-size: 0.9em;">
  <span style="color: var(--subtext); align-self:center;" data-i18n="share_label">공유:</span>
  <button type="button" class="share-btn" data-share="copy-short"
          title="한글 깨짐 없는 단축 링크 (권장)" data-i18n-title="share_copy_short_hint"
          style="padding:0.4em 0.9em; border-radius:999px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); cursor:pointer; font-family:inherit;">
    <span data-i18n="share_copy_short">🔗 단축 링크 복사</span>
  </button>
  <button type="button" class="share-btn" data-share="copy-full"
          title="원본 한글 URL" data-i18n-title="share_copy_full_hint"
          style="padding:0.4em 0.9em; border-radius:999px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); cursor:pointer; font-family:inherit; font-size:0.85em;">
    <span data-i18n="share_copy_full">한글 URL</span>
  </button>
  <a class="share-btn" data-share="twitter"
     href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ short_url | url_encode }}"
     target="_blank" rel="noopener"
     style="display:inline-flex; align-items:center; gap:0.4em; padding:0.4em 0.9em; border-radius:999px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); text-decoration:none;">
    <!-- X 로고 (Simple Icons, CC0) — 글자색을 따라 다크 모드에서 밝게. 라벨 span 은 번역 스크립트가 글자를 통째로 바꾸므로 로고는 밖에 둔다 -->
    <svg viewBox="0 0 24 24" width="0.95em" height="0.95em" aria-hidden="true" style="flex:none;"><path fill="currentColor" d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
    <span data-i18n="share_twitter">트위터</span>
  </a>
  <button type="button" class="share-btn" data-share="webshare"
          style="padding:0.4em 0.9em; border-radius:999px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); cursor:pointer; font-family:inherit;">
    <span data-i18n="share_webshare">📤 공유…</span>
  </button>
  <span id="share-toast" style="display:none; padding:0.4em 0.9em; background:#222; color:white; border-radius:999px; font-size:0.85em;" data-i18n="share_toast">복사됨!</span>
</div>

<script>
(function () {
  var btns = document.querySelectorAll('.share-btn');
  var toast = document.getElementById('share-toast');
  var fullUrl = '{{ share_url }}';
  var shortUrl = '{{ short_url }}';
  var title = '{{ page.title | escape }}';

  function showToast(msg) {
    if (!toast) return;
    toast.textContent = msg;
    toast.style.display = 'inline-block';
    setTimeout(function () { toast.style.display = 'none'; }, 1800);
  }

  function doCopy(text, msg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showToast(msg); },
        function () { fallbackCopy(text, msg); }
      );
    } else {
      fallbackCopy(text, msg);
    }
  }
  function fallbackCopy(text, msg) {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast(msg);
  }

  btns.forEach(function (b) {
    var kind = b.getAttribute('data-share');
    if (kind === 'copy-short') {
      b.addEventListener('click', function () { doCopy(shortUrl, FimT('share_toast_short', '🔗 단축 링크 복사됨!')); });
    } else if (kind === 'copy-full') {
      b.addEventListener('click', function () { doCopy(fullUrl, FimT('share_toast_full', '한글 URL 복사됨')); });
    } else if (kind === 'webshare') {
      if (!navigator.share) { b.style.display = 'none'; return; }
      b.addEventListener('click', function () {
        navigator.share({ title: title, url: shortUrl }).catch(function () {});
      });
    }
  });
})();
</script>
