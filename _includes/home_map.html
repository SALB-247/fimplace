<!-- 메인 페이지 미니 지도: 필터 없음, 정사각형, 전체 장소 점 + 현재 핌둥이들 위치 -->
<div id="home-map-wrap" style="position:relative; width:100%; margin:0.5em 0 1em;">
  <div id="home-map" style="width:100%; aspect-ratio:1/1; border-radius:10px; border:1px solid var(--box-border,#ddd); background:#eef4f8;"></div>
  <a href="{{ site.baseurl }}/map/" style="position:absolute; right:10px; bottom:10px; z-index:800; background:rgba(255,255,255,0.92); border:1px solid #ccc; border-radius:999px; padding:0.3em 0.9em; font-size:0.82em; font-weight:700; text-decoration:none; color:#333; box-shadow:0 1px 4px rgba(0,0,0,0.15);" data-i18n="home_map_all">🗺️ 전체 지도 →</a>
</div>

<style>
  .fim-crew-mini { position:relative; width:80px; height:44px; }
  .fim-crew-mini .pulse { position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:rgba(201,24,74,0.45); animation:home-crew-pulse 2s ease-out infinite; }
  @keyframes home-crew-pulse { 0% { transform:scale(0.6); opacity:0.8; } 100% { transform:scale(2.6); opacity:0; } }
  .fim-crew-mini .badge { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:76px; padding:6px 9px; border-radius:999px; border:2px solid #c9184a; background:#fff; box-sizing:border-box; box-shadow:0 2px 5px rgba(0,0,0,0.3); }
  .fim-crew-mini .badge img { width:100%; display:block; }
  /* 팝업스토어 마커 (공연=크림슨 로고 / 팝업=보라 🛍️ 로 구분) */
  .fim-pop-mini { position:relative; width:44px; height:44px; }
  .fim-pop-mini .pulse { position:absolute; left:50%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; background:rgba(109,40,217,0.45); animation:home-crew-pulse 2s ease-out infinite; }
  .fim-pop-mini .badge { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%; border:2px solid #6d28d9; background:#fff; box-sizing:border-box; box-shadow:0 2px 5px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; font-size:17px; line-height:1; font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  @media (prefers-reduced-motion: reduce) { .fim-crew-mini .pulse, .fim-pop-mini .pulse { animation:none; } }
  #home-map .leaflet-popup-content { overflow-wrap:anywhere; }
</style>

{% include map_tiles.html %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script>
(function () {
  var wrapLng = FimMap.wrapLng;   // 타일·옵션 정의: _includes/map_tiles.html
  var map = L.map('home-map', FimMap.mapOptions(L, {
    zoomControl: false, attributionControl: false,
    scrollWheelZoom: false   // 스크롤 중 지도에 잡히지 않게 (클릭 후 +/- 또는 더블클릭 줌)
  })).setView([33.5, 132.0], 3);
  FimMap.tiles(L).voyager.addTo(map);
  // 팝업 폭을 지도 폭에 맞춘다 (2026-09-27 점검 BUG-03): Leaflet 기본 maxWidth 300 + 내용 여백 44px 이
  //   폰에서 지도(≈330px)보다 넓어 팝업 오른쪽과 닫기 버튼이 지도 밖으로 잘렸다. 좌우 여백 12px 씩 남기고 자동 이동도 그 안으로
  function popupOpts() {
    var w = map.getSize().x;
    return { autoClose: false, closeOnClick: false, maxWidth: Math.max(140, Math.min(300, w - 72)),
             autoPanPadding: L.point(12, 12) };
  }
  map.on('focus click', function () { map.scrollWheelZoom.enable(); });
  map.on('blur', function () { map.scrollWheelZoom.disable(); });

  // 전체 장소 점
  fetch('{{ site.baseurl }}/places.json')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      ((d && d.places) || []).forEach(function (p) {
        if (p.lat == null || p.lng == null) return;
        L.circleMarker([p.lat, wrapLng(p.lng)], {
          radius: 3, weight: 1, color: '#c9184a', fillColor: '#f0728f', fillOpacity: 0.55
        }).addTo(map).bindPopup('<a href="{{ site.baseurl }}' + p.url + '">' + (p.title || '') + '</a>');
      });
    })
    .catch(function () {});

  // 현재 핌둥이들 위치 (오늘 공연 → 다음 공연 → 최근 공연)
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // 공연(tour_schedule) + 팝업스토어(events) 를 함께 표시.
  // 판정은 브라우저 new Date() 기준이라 빌드 후 날짜가 지나도 자동 갱신됨.
  Promise.all([
    fetch('{{ site.baseurl }}/tour_schedule.json').then(function (r) { return r.json(); }).catch(function () { return { shows: [] }; }),
    fetch('{{ site.baseurl }}/events.json').then(function (r) { return r.json(); }).catch(function () { return { events: [] }; })
  ]).then(function (res) {
    var NOW = new Date();
    var t = ymd(NOW);
    // 공연장·행사장 현지 오늘 (FimTime) — 서울에서 볼 때 미국 공연이 하루 먼저 끝나 보이지 않게
    function tzToday(tz) { return (window.FimTime && FimTime.isValidTz(tz)) ? FimTime.todayIn(tz, NOW) : t; }
    var pts = [], autoCand = [];

    // ── 공연: 오늘 → 다음 → 최근 (각 공연장의 현지 날짜로) ──
    var shows = ((res[0] && res[0].shows) || []).filter(function (s) {
      return !s.cancelled && s.lat != null && s.dates && s.dates.length;
    });
    var pick = null, pickDate = null, state = null, pickToday = t;
    shows.forEach(function (s) {
      var ts = tzToday(s.time_zone);
      if (s.dates.indexOf(ts) !== -1) { pick = s; pickDate = ts; pickToday = ts; state = 'live'; }
    });
    if (!pick) shows.forEach(function (s) {
      var ts = tzToday(s.time_zone);
      s.dates.forEach(function (dd) {
        if (dd > ts && (pickDate === null || dd < pickDate)) { pickDate = dd; pick = s; pickToday = ts; state = 'next'; }
      });
    });
    if (!pick) shows.forEach(function (s) {
      var ts = tzToday(s.time_zone);
      s.dates.forEach(function (dd) {
        if (dd < ts && (pickDate === null || dd > pickDate)) { pickDate = dd; pick = s; pickToday = ts; state = 'last'; }
      });
    });

    if (pick) {
      // ⚠️ img 는 인라인 width 필수 — Leaflet 의 `.leaflet-marker-pane img { width:auto }` 가
      //    외부 CSS 셀렉터보다 구체성이 높아 클래스 규칙으로는 못 이김 (SVG 원본 800px 로 터짐)
      var html = '<div class="fim-crew-mini"><div class="pulse"></div>' +
        '<div class="badge"><img src="{{ site.baseurl }}/assets/LE_SSERAFIM_logo.svg" alt="LE SSERAFIM" style="width:100%;height:auto;display:block;"></div></div>';
      var head = state === 'live' ? FimT('home_show_today', '🔴 오늘 공연!')
               : state === 'next' ? FimT('home_show_next', '다음 공연')
               : FimT('home_show_recent', '최근 공연');
      var ll = [pick.lat, wrapLng(pick.lng)];
      var m = L.marker(ll, { icon: L.divIcon({ className: '', html: html, iconSize: [80,44], iconAnchor: [40,22] }), zIndexOffset: 1000 })
        .addTo(map)
        .bindPopup('<strong>' + head + '</strong><br>' + (pick.flag||'') + ' ' + FimTag(pick.city||'') +
          (pick.venue_url ? '<br><a href="{{ site.baseurl }}' + pick.venue_url + '">' + pick.venue + '</a>' : '') +
          '<br><span style="font-size:0.85em;color:#888;">📅 ' + pick.date_raw + (FimLang !== 'ko' ? ' (local)' : ' (현지)') + '</span>' +
          (function () {   // 확정 시각이 있으면 현지·내 시간 이중 표시
            if (!pick.start_time || !window.FimTime) return '';
            var du = FimTime.dual(pick, pickDate);
            if (!du) return '';
            return '<br><span style="font-size:0.8em;color:#888;">🕒 ' + du.local + (du.sameTz ? '' : ' · ' + du.viewer + (du.dayLabel ? ' [' + du.dayLabel + ']' : '')) + '</span>';
          })(),
          popupOpts());
      pts.push(ll);
      autoCand.push({ marker: m, rank: state === 'live' ? 0 : 1,
                      gap: Math.abs(FimTime ? FimTime.dayDiff(pickToday, pickDate) : 0) });
    }

    // ── 팝업스토어: 진행 중 전부 → 없으면 가장 가까운 예정 1곳 ──
    //    (종료된 팝업은 이제 갈 수 없으므로 표시하지 않음)
    var pops = ((res[1] && res[1].events) || []).filter(function (e) {
      return e.type === '팝업' && e.lat != null && e.start;
    });
    var live = pops.filter(function (e) { var te = tzToday(e.time_zone); return e.start <= te && te <= e.end; });
    var chosen = live;
    if (!chosen.length) {
      var up = pops.filter(function (e) { return e.start > tzToday(e.time_zone); })
                   .sort(function (a, b) { return a.start < b.start ? -1 : 1; });
      if (up.length) chosen = [up[0]];
    }
    chosen.forEach(function (e) {
      var te = tzToday(e.time_zone);
      var isLive = e.start <= te && te <= e.end;
      var dday = window.FimTime ? FimTime.dayDiff(te, e.start) : Math.round((new Date(e.start) - new Date(te)) / 86400000);
      var head = isLive ? FimT('home_popup_live', '🛍️ 팝업 진행 중')
               : (FimLang !== 'ko' ? FimFmt(FimT('home_popup_dday', ''), [dday])
                                   : '🛍️ 팝업 D-' + dday);
      var ll = [e.lat, wrapLng(e.lng)];
      var m = L.marker(ll, {
        icon: L.divIcon({ className: '', html: '<div class="fim-pop-mini"><div class="pulse"></div><div class="badge">🛍️</div></div>',
                          iconSize: [44,44], iconAnchor: [22,22] }), zIndexOffset: 900 })
        .addTo(map)
        .bindPopup('<strong>' + head + '</strong><br><a href="' + e.url + '">' + e.title + '</a>' +
          '<br><span style="font-size:0.85em;color:#888;">📅 ' + e.start + ' ~ ' + e.end + '</span>',
          popupOpts());
      pts.push(ll);
      autoCand.push({ marker: m, rank: isLive ? 0 : 1, gap: Math.abs(dday) });
    });

    // ── 뷰 + 팝업 자동 열기 (가장 임박한 것 1개만 열어 말풍선 겹침 방지) ──
    //   ⚠️ 첫 뷰는 애니메이션 없이 (2026-09-27 점검 BUG-03): 폰 폭에선 서울 팝업과 미국 공연이 한 화면에 안 들어가
    //   팝업이 자동 이동(autoPan)해야 하는데, fitBounds 줌 애니메이션이 끝나면서 그 이동을 원래 중심으로 되돌려
    //   팝업이 지도 왼쪽 밖(마커 x≈3px)에 남았다
    if (pts.length === 1) map.setView(pts[0], 5, { animate: false });
    else if (pts.length > 1) {
      try { map.fitBounds(L.latLngBounds(pts), { padding: [70,70], maxZoom: 6, animate: false }); }
      catch (err) { map.setView(pts[0], 5, { animate: false }); }
    }
    autoCand.sort(function (a, b) { return a.rank - b.rank || a.gap - b.gap; });
    if (autoCand.length) {
      var first = autoCand[0].marker;
      // 폰 폭에선 모든 점이 한 화면에 안 들어간다 — 자동으로 여는 말풍선의 마커가 화면 밖이면 그 마커를 가운데로 (애니메이션 없이).
      //   그래야 말풍선이 처음부터 지도 안에 뜬다 (autoPan 의 이동 애니메이션에 기대지 않는다)
      if (!map.getBounds().pad(-0.15).contains(first.getLatLng())) map.setView(first.getLatLng(), map.getZoom(), { animate: false });
      // 첫 말풍선은 애니메이션 없이 지도 안으로 — Leaflet autoPan 의 이동 애니메이션(requestAnimationFrame)은 탭이 가려져 있으면
      //   멈춰 말풍선이 가장자리에 걸린 채 남는다. 사용자가 여는 말풍선은 원래대로 autoPan
      var pp = first.getPopup();
      pp.options.autoPan = false;
      first.openPopup();
      pp.options.autoPan = true;
      var pel = pp.getElement();
      if (pel) {
        var mr = map.getContainer().getBoundingClientRect(), pr = pel.getBoundingClientRect(), pdx = 0, pdy = 0;
        if (pr.left < mr.left + 12) pdx = pr.left - mr.left - 12;
        else if (pr.right > mr.right - 12) pdx = pr.right - mr.right + 12;
        if (pr.top < mr.top + 12) pdy = pr.top - mr.top - 12;
        if (pdx || pdy) map.panBy([pdx, pdy], { animate: false });
      }
    }
  })
  .catch(function () {});
})();
</script>
