# 공연장·도시 시간대 (IANA ID) — 현지 시간 모듈의 원본 (2026-09-22)
#
# 우선순위 (_plugins/timezones.rb FimTz.resolve):
#   1. 공연장 노트 frontmatter `timezone:`            (검증된 값을 노트에 직접)
#   2. venues:   노트 제목 → 시간대
#   3. cities:   도시 태그·투어 표의 도시 셀 → 시간대  (미국처럼 시간대가 여럿인 나라는 반드시 여기로)
#   4. countries: 국가 코드 → 시간대  (⚠️ 시간대가 하나뿐인 나라만. us·mx·id·ca·au·br·ru 는 넣지 않는다)
# 하나도 못 찾으면 null → 화면은 '시간대 확인 필요' 로 두고 자동 판정을 보류한다.
# 고정 시차(+16h 등)는 쓰지 않는다 — 브라우저 Intl 이 그 날짜의 서머타임 규칙을 적용한다.

